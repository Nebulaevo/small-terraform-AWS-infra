services:
  wordpress:
    image: wordpress:7
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    
    environment:
      WORDPRESS_DB_HOST: "database:3306"
      WORDPRESS_DB_USER: "wordpress"
      WORDPRESS_DB_PASSWORD: "wordpress-user-password-123"
      WORDPRESS_DB_NAME: "wordpress-db"
    
    ports:
      - "80:80"
    networks:
      - public_network
      - private_network
    
    # Limiting RAM usage: because deployed on small AWS instance (1Go RAM)
    deploy:
      resources:
        limits:
          memory: 256M

  database:
    image: mysql:9
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: "root-user-password-123"
      MYSQL_USER: "wordpress"
      MYSQL_PASSWORD: "wordpress-user-password-123"
      MYSQL_DATABASE: "wordpress-db"

    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - private_network

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    
    # Limiting RAM usage: because deployed on small AWS instance (1Go RAM)
    command:
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=128M
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  db_data:

networks:
  public_network:
  private_network:
    internal: true