name: "Deploy Prod"

on:
  workflow_dispatch:

jobs:
  ci:
    name: "Integration checks"
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v6
      
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_IAM_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_IAM_SECRET_ACCESS_KEY }}
          aws-region: "eu-north-1"
      
      - uses: hashicorp/setup-terraform@v4

      - name: Check formating
        run: terraform fmt -recursive -check # check -> doesn't modify
      
      - name: Init
        run: terraform init
        working-directory: src/environments/prod

      - name: Validate
        run: terraform validate
        working-directory: src/environments/prod
  
  cd:
    name: "Deployment"
    runs-on: ubuntu-latest

    needs: [ ci ]

    steps:
      - uses: actions/checkout@v6

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_IAM_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_IAM_SECRET_ACCESS_KEY }}
          aws-region: "eu-north-1"
      
      - uses: hashicorp/setup-terraform@v4

      # Needed for terraform "kreuzwerker/docker" provider to use SSH
      # (because it uses system ssh creds, cannot give it special ones)
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Init
        run: terraform init
        working-directory: src/environments/prod
      
      - name: Apply
        run: terraform apply -auto-approve
        working-directory: src/environments/prod
        env:
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
          TF_VAR_ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
