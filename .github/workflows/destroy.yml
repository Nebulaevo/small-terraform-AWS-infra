name: "Destroy Infrastructure"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        type: choice
        required: true
        default: dev
        options:
          - dev
          - prod

jobs:
  destroy:
    name: "Destroy (${{ inputs.environment }})"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_IAM_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_IAM_SECRET_ACCESS_KEY }}
          aws-region: "eu-north-1"

      # Needed for terraform "kreuzwerker/docker" provider to use SSH
      # (because it uses system ssh creds, cannot give it special ones)
      - name: Setup SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      
      # Creating .env file with secrets for docker compose
      - name: Create .env
        run: |
          cat > .env <<EOF
          DB_ROOT_PASSWORD=$DB_ROOT_PASSWORD
          DB_USER=$DB_USER
          DB_USER_PASSWORD=$DB_USER_PASSWORD
          DATABASE=$DATABASE
          EOF
        env:
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_USER_PASSWORD: ${{ secrets.DB_USER_PASSWORD }}
          DATABASE: ${{ secrets.DATABASE }}

      - name: Init
        run: terraform init
        working-directory: src/environments/${{ inputs.environment }}
      
      - name: Destroy
        run: terraform destroy -auto-approve
        working-directory: src/environments/${{ inputs.environment }}
        env:
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
          TF_VAR_ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
